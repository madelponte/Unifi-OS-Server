services:
  unifi-os-server:
    image: ghcr.io/madelponte/unifi-os-server:latest
    platform: linux/amd64
    container_name: unifi-os-server
    restart: unless-stopped
    stop_signal: SIGRTMIN+3
    stop_grace_period: 2m

    # UniFi OS runs its components as systemd services.
    cgroup: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    extra_hosts:
      - host.docker.internal:host-gateway
      - host.containers.internal:host-gateway
    environment:
      TZ: ${TZ:-Etc/UTC}
      # This must resolve to/reach the Docker host from the device network.
      # Using the container's private bridge IP will break provisioning.
      UOS_SYSTEM_IP: ${UOS_SYSTEM_IP:?Set UOS_SYSTEM_IP to a hostname or LAN IP reachable by UniFi devices}
    tmpfs:
      - /run:exec
      - /run/lock
      - /tmp:exec
      - /var/lib/journal
      - /var/opt/unifi/tmp:size=64m
    healthcheck:
      test: [CMD, curl, --fail, http://127.0.0.1/api/ping]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 2m
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./data/persistent:/persistent
      - ./data/var-log:/var/log
      - ./data/data:/data
      - ./data/srv:/srv
      - ./data/var-lib-unifi:/var/lib/unifi
      - ./data/var-lib-mongodb:/var/lib/mongodb
      - ./data/etc-rabbitmq-ssl:/etc/rabbitmq/ssl
    ports:
      # UniFi OS web interface: https://HOST:11443
      - 11443:443

      # Device communication and adoption.
      - 8080:8080 # Inform endpoint: http://HOST:8080/inform
      - 3478:3478/udp # STUN

      # The Network app still listens on the legacy discovery port while
      # UniFi OS Server also uses its newer discovery service port.
      - 10001:10001/udp # Network device discovery
      - 10003:10003/udp # UniFi OS Server discovery

      # Optional UniFi services. Uncomment those you use.
      # - 5005:5005 # RTP control
      # - 5514:5514/udp # Remote syslog
      # - 5671:5671 # AMQPS
      # - 6789:6789 # Mobile speed test
      # - 8443:8443 # Direct Network application GUI/API
      # - 8444:8444 # Secure hotspot portal
      # - 8880:8880 # Hotspot redirect
      # - 8881:8881 # Hotspot redirect
      # - 8882:8882 # Hotspot redirect
      # - 9543:9543 # Identity Hub
      # - 127.0.0.1:11084:11084 # Site supervisor; do not expose publicly
      # - 1900:1900/udp # Optional L2 discoverability/SSDP
      # - 10101:10101/udp # Client fingerprinting
      # - 28082:28082 # Device support-file downloads
